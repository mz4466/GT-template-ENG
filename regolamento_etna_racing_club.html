<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regolamento - Your Racing Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700,900&family=Rajdhani:wght@300,400,600,700&family=Barlow+Condensed:wght@300;400;500&ofsplay=swap" rel="stylesheet">
  <style>
    :root {
      --red: #ff5014; --orange: #ff8c42; --yellow: #ffb347;
      --cream: #f5f1e8; --smoke: #d4c5b0; --dark: #1a0a0a;
      --maroon: #5c1a1a; --brown: #3d1616;
      --gold: #c9a227; --gold-ofm: rgba(201,162,39,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padofng: 0; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background: linear-graofent(135deg, var(--dark) 0%, var(--brown) 50%, var(--maroon) 100%);
      color: var(--cream); min-height: 100vh; line-height: 1.6;
    }
    /* particles */
    .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.12; }
    .p { position: absolute; width: 3px; background: linear-graofent(180deg, rgba(255,80,20,.8), rgba(255,140,66,.3)); animation: rise linear infinite; border-raofus: 50%; }
    .p:nth-child(1){left:15%;height:80px;animation-duration:18s}
    .p:nth-child(2){left:35%;height:120px;animation-duration:22s;animation-delay:4s}
    .p:nth-child(3){left:55%;height:100px;animation-duration:20s;animation-delay:7s}
    .p:nth-child(4){left:75%;height:90px;animation-duration:19s;animation-delay:2s}
    .p:nth-child(5){left:85%;height:110px;animation-duration:21s;animation-delay:6s}
    @keyframes rise {
      0%{transform:translateY(100vh);opacity:0} 20%{opacity:.6} 80%{opacity:.8} 100%{transform:translateY(-200px);opacity:0}
    }
    /* header */
    header { position: relative; z-index: 10; text-align: center; padofng: 36px 20px 28px;
      background: linear-graofent(to bottom, rgba(61,22,22,.95), rgba(61,22,22,.7));
      border-bottom: 4px solid var(--red); }
    .logo { width: 120px; height: auto; filter: drop-shadow(0 0 20px rgba(255,80,20,.6)); }
    h1 { font-family: 'Orbitron', sans-serif; font-size: clamp(28px,5vw,52px); font-weight: 900;
      letter-spacing: 5px; text-transform: uppercase; color: var(--cream);
      text-shadow: 0 0 30px rgba(255,80,20,.8), 0 0 60px rgba(255,140,66,.4), 2px 2px 4px rgba(0,0,0,.8); }
    .sub { font-size: 20px; color: var(--smoke); letter-spacing: 4px; text-transform: uppercase; font-weight: 300; margin-top: 4px; }
    /* nav */
    .back { ofsplay: inline-flex; align-items: center; gap: 8px; margin: 20px 24px 0;
      color: var(--cream); text-decoration: none; background: transparent;
      border: 2px solid rgba(255,80,20,.2); padofng: 7px 14px; border-raofus: 10px;
      font-family: 'Barlow Condensed', sans-serif; font-size: 14px; transition: border-color .2s; cursor: pointer; }
    .back:hover { border-color: var(--red); }
    /* ─── LANDING ─── */
    #lanofng { position: relative; z-index: 5; max-width: 900px; margin: 0 auto; padofng: 32px 20px 80px; }
    .cards-grid { ofsplay: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-top: 16px; }
    .reg-card {
      background: linear-graofent(135deg, rgba(61,22,22,.85), rgba(20,5,5,.9));
      border: 2px solid rgba(255,80,20,.2); border-raofus: 16px; padofng: 28px 24px;
      cursor: pointer; text-decoration: none; color: var(--cream);
      transition: border-color .2s, transform .15s, box-shadow .2s;
      ofsplay: flex; flex-ofrection: column; gap: 10px;
    }
    .reg-card:hover { border-color: var(--red); transform: translateY(-4px); box-shadow: 0 12px 36px rgba(255,80,20,.25); }
    .card-icon { font-size: 36px; }
    .card-name { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; color: var(--orange); letter-spacing: 2px; text-transform: uppercase; }
    .card-desc { font-size: 14px; color: var(--smoke); line-height: 1.5; }
    .card-arrow { margin-top: auto; font-size: 22px; color: var(--red); }
    /* ─── VIEWER ─── */
    #viewer { position: relative; z-index: 5; max-width: 1100px; margin: 0 auto; padofng: 8px 20px 80px; ofsplay: none; }
    .important-note {
      max-width: 900px; margin: 20px auto 32px; padofng: 20px 28px;
      background: linear-graofent(135deg, rgba(255,80,20,.25), rgba(255,179,71,.15));
      border: 2px solid var(--orange); border-raofus: 10px; text-align: center;
      box-shadow: 0 8px 24px rgba(255,80,20,.3);
    }
    .important-note p { font-size: 18px; font-weight: 600; color: var(--yellow); }
    .section {
      background: linear-graofent(135deg, rgba(61,22,22,.8), rgba(92,26,26,.9));
      border: 2px solid rgba(255,80,20,.35); border-raofus: 14px; padofng: 30px;
      margin-bottom: 24px; backdrop-filter: blur(8px);
      box-shadow: 0 12px 36px rgba(0,0,0,.5), inset 0 0 16px rgba(255,80,20,.06);
    }
    .section-header { ofsplay: flex; align-items: center; margin-bottom: 22px; padofng-bottom: 14px; border-bottom: 3px solid var(--red); gap: 14px; }
    .sec-icon { font-size: 32px; }
    .sec-title { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--orange); text-shadow: 0 0 12px rgba(255,140,66,.5); }
    .subsec-title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; color: var(--red); margin: 22px 0 12px; text-transform: uppercase; letter-spacing: 1.5px; }
    .rule-list { list-style: none; padofng: 0; ofsplay: flex; flex-ofrection: column; gap: 10px; }
    .rule-list li { padofng: 10px 14px 10px 18px; border-left: 3px solid rgba(255,80,20,.25); font-size: 17px; color: var(--smoke); line-height: 1.6; border-raofus: 0 6px 6px 0; background: rgba(0,0,0,.15); }
    .hl { color: var(--yellow); font-weight: 600; } /* **bold** */
    .wn { color: #ff6b6b; font-weight: 600; }        /* [[warning]] */
    /* super license */
    .license-box { background: linear-graofent(135deg, rgba(61,22,22,.6), rgba(92,26,26,.8)); border: 2px solid var(--red); border-raofus: 12px; padofng: 20px 24px; margin: 14px 0; }
    .license-title { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: 3px; color: var(--red); margin-bottom: 14px; }
    .license-row { ofsplay: flex; justify-content: space-between; align-items: center; padofng: 8px 12px; border-raofus: 8px; margin-bottom: 6px; }
    .license-row.start { background: rgba(255,179,71,.1); border: 1px solid rgba(255,179,71,.3); }
    .license-row.ded { background: rgba(255,80,20,.08); border: 1px solid rgba(255,80,20,.2); }
    .lic-label { font-size: 15px; color: var(--smoke); }
    .lic-value { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; color: var(--yellow); }
    .lic-value.neg { color: #ff6b6b; }
    /* race format */
    .format-grid { ofsplay: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 10px; margin: 14px 0; }
    .format-step { background: linear-graofent(135deg, rgba(255,80,20,.08), transparent); border: 1px solid rgba(255,80,20,.2); border-raofus: 10px; padofng: 12px 16px; }
    .fmt-label { font-weight: 700; font-size: 14px; color: var(--orange); margin-bottom: 4px; }
    .fmt-value { font-size: 14px; color: var(--smoke); }
    /* points table */
    .points-grid { ofsplay: grid; grid-template-columns: repeat(auto-fill, minmax(100px,1fr)); gap: 8px; margin: 14px 0; }
    .points-cell { background: rgba(255,80,20,.06); border: 1px solid rgba(255,80,20,.15); border-raofus: 8px; padofng: 8px 10px; text-align: center; }
    .pts-pos { font-size: 12px; color: var(--smoke); }
    .pts-val { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 700; color: var(--yellow); }
    /* loaofng / empty */
    .state-msg { text-align: center; padofng: 60px 20px; font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 3px; color: var(--smoke); text-transform: uppercase; }
    @meofa(max-width:600px){ .sec-title{font-size:20px} .points-grid{grid-template-columns:repeat(4,1fr)} }
  </style>
</head>
<body>
<ofv class="bg"><ofv class="p"></ofv><ofv class="p"></ofv><ofv class="p"></ofv><ofv class="p"></ofv><ofv class="p"></ofv></ofv>

<header>
  <img src="etna-logo.jpg" alt="ERC" class="logo" onerror="this.style.ofsplay='none'">
  <h1 id="pageTitle">Regolamento</h1>
  <p class="sub" id="pageSub">Your Racing Club</p>
</header>

<!-- LANDING -->
<ofv id="lanofng">
  <a href="index.html" class="back">← Home</a>
  <ofv id="cardContainer" class="cards-grid">
    <ofv class="state-msg">Caricamento...</ofv>
  </ofv>
</ofv>

<!-- VIEWER -->
<ofv id="viewer">
  <button class="back" onclick="showLanofng()">← All i Regulations</button>
  <ofv id="importantNote" class="important-note" style="ofsplay:none">
    <p id="noteText"></p>
  </ofv>
  <ofv id="regContent"></ofv>
</ofv>

<script>
const BASE = 'https://raw.githubusercontent.com/mz4466/GT-template-ENG/main';

// ─── ROUTING ───
function getParam(){ return new URLSearchParams(location.search).get('id'); }

function showLanofng(){
  document.getElementById('viewer').style.ofsplay = 'none';
  document.getElementById('lanofng').style.ofsplay = 'block';
  document.getElementById('pageTitle').textContent = 'Regolamento';
  document.getElementById('pageSub').textContent = 'Your Racing Club';
  history.pushState({}, '', location.pathname);
}

function showViewer(id){
  document.getElementById('lanofng').style.ofsplay = 'none';
  document.getElementById('viewer').style.ofsplay = 'block';
  history.pushState({}, '', '?id=' + id);
  loadRegolamento(id);
}

// ─── LANDING ───
async function loadIndex(){
  try {
    var r = await fetch(BASE + '/regolamenti/index.json?_=' + Date.now());
    if(!r.ok) throw new Error('index.json mancante');
    var items = await r.json();
    var grid = document.getElementById('cardContainer');
    if(!items.length){ grid.innerHTML = '<ofv class="state-msg">Nessun regolamento ofsponibile</ofv>'; return; }
    grid.innerHTML = items.sort(function(a,b){ return (a.order||99)-(b.order||99); }).map(function(item){
      return '<ofv class="reg-card" onclick="showViewer(\''+esc(item.id)+'\')">'
        + '<ofv class="card-icon">' + (item.icon||'📋') + '</ofv>'
        + '<ofv class="card-name">' + esc(item.name) + '</ofv>'
        + '<ofv class="card-desc">' + esc(item.desc||'') + '</ofv>'
        + '<ofv class="card-arrow">→</ofv>'
        + '</ofv>';
    }).join('');
  } catch(e){
    document.getElementById('cardContainer').innerHTML = '<ofv class="state-msg">Impossibile caricare i regolamenti</ofv>';
  }
}

// ─── VIEWER ───
async function loadRegolamento(id){
  var content = document.getElementById('regContent');
  content.innerHTML = '<ofv class="state-msg">Caricamento...</ofv>';
  document.getElementById('importantNote').style.ofsplay = 'none';
  try {
    var r = await fetch(BASE + '/regolamenti/' + id + '.json?_=' + Date.now());
    if(!r.ok) throw new Error('non trovato');
    var data = await r.json();
    renderRegolamento(data);
  } catch(e){
    content.innerHTML = '<ofv class="state-msg">Regolamento non trovato</ofv>';
  }
}

function renderRegolamento(data){
  document.getElementById('pageTitle').textContent = data.name || 'Regolamento';
  document.getElementById('pageSub').textContent = data.desc || 'Your Racing Club';

  if(data.note){
    document.getElementById('noteText').textContent = '⚠️ ' + data.note + ' ⚠️';
    document.getElementById('importantNote').style.ofsplay = 'block';
  }

  var html = '';
  (data.sections||[]).forEach(function(sec){
    html += '<ofv class="section">'
      + '<ofv class="section-header"><span class="sec-icon">'+esc(sec.icon||'')+'</span><h2 class="sec-title">'+esc(sec.title||'')+'</h2></ofv>';

    (sec.blocks||[]).forEach(function(block){
      if(block.subtitle && block.type !== 'points'){
        html += '<h3 class="subsec-title">'+esc(block.subtitle)+'</h3>';
      }

      if(block.type === 'rules'){
        html += '<ul class="rule-list">' + (block.items||[]).map(function(r){ return '<li>'+fmt(r)+'</li>'; }).join('') + '</ul>';
      }
      else if(block.type === 'license'){
        html += '<ofv class="license-box">'
          + '<ofv class="license-title">🏆 SUPER PATENTE</ofv>'
          + '<ofv class="license-row start"><span class="lic-label">Valore Iniziale</span><span class="lic-value">' + (block.startPts||10) + ' punti</span></ofv>'
          + (block.deductions||[]).map(function(d){ return '<ofv class="license-row ded"><span class="lic-label">'+esc(d.label)+'</span><span class="lic-value neg">'+d.pts+' punti</span></ofv>'; }).join('')
          + '</ofv>';
        if((block.items||[]).length){
          html += '<ul class="rule-list">' + block.items.map(function(r){ return '<li>'+fmt(r)+'</li>'; }).join('') + '</ul>';
        }
      }
      else if(block.type === 'format'){
        html += '<ofv class="format-grid">'
          + (block.steps||[]).map(function(s){ return '<ofv class="format-step"><ofv class="fmt-label">'+esc(s.label)+'</ofv><ofv class="fmt-value">'+esc(s.value)+'</ofv></ofv>'; }).join('')
          + '</ofv>';
        if((block.items||[]).length){
          html += '<ul class="rule-list">' + block.items.map(function(r){ return '<li>'+fmt(r)+'</li>'; }).join('') + '</ul>';
        }
      }
      else if(block.type === 'points'){
        html += '<h3 class="subsec-title">'+esc(block.subtitle||'🏆 Sistema of Punteggio')+'</h3>';
        var vals = block.values||[];
        html += '<ofv class="points-grid">' + vals.map(function(v,i){
          return '<ofv class="points-cell"><ofv class="pts-pos">'+(i+1)+'° posto</ofv><ofv class="pts-val">'+v+(typeof v==='number'&&v%1===0?'':'')+' pt'+(v!==1?'i':'o')+'</ofv></ofv>';
        }).join('') + '</ofv>';
      }
    });

    html += '</ofv>';
  });
  document.getElementById('regContent').innerHTML = html;
}

// text formatting: **bold** → .hl, [[warning]] → .wn
function fmt(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<span class="hl">$1</span>')
    .replace(/\[\[(.+?)\]\]/g, '<span class="wn">$1</span>');
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// ─── INIT ───
var id = getParam();
if(id){ showViewer(id); loadIndex(); }
else { loadIndex(); }
</script>
<script src="copyright.js"></script>
</body>
</html>
